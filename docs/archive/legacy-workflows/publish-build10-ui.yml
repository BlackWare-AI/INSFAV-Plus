name: Publish same-version build 10 UI and audit update
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insfav-build10-ui-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BlackWare-AI/INSFAV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source, same version/build, certificate and complete report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/release/tests -v
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          test "$(gh api "repos/$GH_REPO/actions/runs/39816872755" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/39816872755" --jq .head_sha)" = b066f5a9af27bf711d084ae1e3ffb076c8b04ced
          git diff --exit-code b066f5a9af27bf711d084ae1e3ffb076c8b04ced HEAD -- app web tests version.properties build.gradle settings.gradle gradle gradlew gradlew.bat package.json package-lock.json tools/minify.cjs tools/web-bundle.json
          git show 6631dc85be0d551907f9079c90e75d829be44107 > public-candidate.zip
          echo '4c7d824798a18a54afa36068e5d4107b2460405dc00a361b8227daa71d3e67fe  public-candidate.zip' | sha256sum --check
          unzip -q public-candidate.zip -d candidate
          (cd candidate && sha256sum --check SHA256SUMS)
          mkdir previous
          gh release download v5.0.0-build.10 --pattern INSFAV-5.0.0.apk --dir previous
          python3 - <<'PY'
          import json,os,sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'tools/release')
          import release_gate_500 as signing
          import update_build10 as manifest
          import polish_build10 as gate
          record=json.loads(Path('candidate/verification.json').read_text());gate.validate_record(record)
          sdk=Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
          tools=sorted(sdk.glob('build-tools/*/apksigner'))[-1].parent
          for path,expected in [(Path('candidate/INSFAV-5.0.0.apk'),gate.APK_SHA256),(Path('previous/INSFAV-5.0.0.apk'),gate.PREVIOUS_APK)]:
              manifest.verify_hash(path,expected)
              assert signing.apk_certificate(tools/'apksigner',path)==gate.CERTIFICATE
              manifest.validate_manifest(signing.captured([str(tools/'aapt'),'dump','badging',str(path)]))
          signing.captured([str(tools/'zipalign'),'-c','-P','16','4','candidate/INSFAV-5.0.0.apk'])
          gate.validate_report(Path('candidate/INSFAV-Teknik-Rapor.html').read_text(),Path('candidate/INSFAV-Android-Studio-Project.zip').read_bytes(),subprocess.check_output(['git','archive','--format=zip',gate.SOURCE]))
          PY
      - name: Upload draft, download checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh api "repos/$GH_REPO/git/ref/tags/v5.0.0-build.10-ui" > tag.json 2>/dev/null; then
            test "$(python3 -c 'import json; print(json.load(open("tag.json"))["object"]["sha"])')" = b066f5a9af27bf711d084ae1e3ffb076c8b04ced
          fi
          gh api "repos/$GH_REPO/releases/420985124" > draft.json
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/release')
          import polish_build10 as gate
          gate.validate_draft(json.load(open('draft.json')),{p.name for p in Path('candidate').iterdir()})
          PY
          gh release upload v5.0.0-build.10-ui candidate/* --clobber
          verify_dir=$(mktemp -d "$RUNNER_TEMP/insfav-build10-ui-download.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download v5.0.0-build.10-ui --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum --check SHA256SUMS)
          test "$(gh api "repos/$GH_REPO/releases/tags/v5.0.0-build.10" --jq '.assets[] | select(.name == "INSFAV-5.0.0.apk") | .digest')" = 'sha256:1918ee03378597605f3a00c6132ac53e5478d79f37be615a3b2ac61b3b2fbf5d'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit v5.0.0-build.10-ui --draft=false --latest
          gh release view v5.0.0-build.10-ui --json url --jq .url
