name: Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: insfav-verification-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'package-verified-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run web
      - run: git diff --exit-code -- app/src/main/assets tools/web-bundle.json web/maps
      - run: node --test tests/core.test.cjs
      - run: |
          mkdir -p /tmp/insfav-policy
          javac -d /tmp/insfav-policy app/src/main/java/com/instagram/insfav/ThumbnailPolicy.java tests/java/com/instagram/insfav/ThumbnailPolicyTest.java
          java -cp /tmp/insfav-policy com.instagram.insfav.ThumbnailPolicyTest
      - name: Baseline native image pipeline measurement
        run: |
          git worktree add --detach /tmp/insfav-native-baseline 54b43f8151ded94ef0b6655c8575d519effe7fb6
          cp app/src/test/java/com/instagram/insfav/ThumbnailPipelineBenchmarkTest.java /tmp/insfav-native-baseline/app/src/test/java/com/instagram/insfav/
          gradle -p /tmp/insfav-native-baseline :app:testDebugUnitTest --tests com.instagram.insfav.ThumbnailPipelineBenchmarkTest
          mkdir -p measurements
          cp /tmp/insfav-native-baseline/app/build/test-results/testDebugUnitTest/TEST-com.instagram.insfav.ThumbnailPipelineBenchmarkTest.xml measurements/native-before.xml
      - name: Baseline read-only rescan on 15000 synthetic files
        run: |
          git worktree add --detach /tmp/insfav-rescan-baseline ba7812fc38e7e35834b909d72740c2873b7e05e7
          cp app/src/test/java/com/instagram/insfav/RescanBenchmarkTest.java /tmp/insfav-rescan-baseline/app/src/test/java/com/instagram/insfav/
          gradle -p /tmp/insfav-rescan-baseline :app:testDebugUnitTest --tests com.instagram.insfav.RescanBenchmarkTest
          cp /tmp/insfav-rescan-baseline/app/build/test-results/testDebugUnitTest/TEST-com.instagram.insfav.RescanBenchmarkTest.xml measurements/rescan-before.xml
      - run: gradle :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Compare rescan evidence
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/rescan-report.py --before measurements/rescan-before.xml --after app/build/test-results/testDebugUnitTest/TEST-com.instagram.insfav.RescanBenchmarkTest.xml --concurrency app/build/test-results/testDebugUnitTest/TEST-com.instagram.insfav.RescanConcurrencyTest.xml --output measurements/rescan-before-after.json
      - name: Web UI and counter regressions
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          export CHROME_BIN="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          node tests/browser.cjs | tee browser-results.txt
          node tests/clipboard-preview.cjs | tee clipboard-results.txt
          mkdir -p /tmp/insfav-thumbnail-baseline
          for name in index.html app.js core.js style.css fonts.css logo.webp inter-{0..6}.woff2; do git show 54b43f8151ded94ef0b6655c8575d519effe7fb6:app/src/main/assets/$name > /tmp/insfav-thumbnail-baseline/$name; done
          BASELINE_ASSETS=/tmp/insfav-thumbnail-baseline node tests/thumbnail-performance.cjs > measurements/browser-before-after.json
          cp app/build/test-results/testDebugUnitTest/TEST-com.instagram.insfav.ThumbnailPipelineBenchmarkTest.xml measurements/native-after.xml
          node tests/probe-browser.cjs | tee probe-results.txt
          node tests/probe-classification.cjs | tee classification-results.txt
          mkdir -p /tmp/insfav-baseline
          for name in index.html app.js core.js style.css fonts.css; do git show e6c7e688617cc056dbb6dfc216c089060c51c86e:app/src/main/assets/$name > /tmp/insfav-baseline/$name; done
          BASELINE_ASSETS=/tmp/insfav-baseline BASELINE_REF=e6c7e688617cc056dbb6dfc216c089060c51c86e node tests/about-counters.cjs | tee counter-results.txt
      - name: Package Android Studio source and debug APK
        run: |
          mkdir -p delivery
          git archive --format=zip --prefix=INSFAV/ -o delivery/INSFAV-Android-Studio-Project.zip HEAD
          cp app/build/outputs/apk/debug/app-debug.apk delivery/INSFAV-debug.apk
          cp README.md delivery/README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-builds
          path: |
            delivery/
            measurements/
            browser-results.txt
            probe-results.txt
            classification-results.txt
            counter-results.txt
            app/build/outputs/apk/
            app/build/outputs/mapping/release/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
            app/build/reports/tests/

  emulator:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: INSFAV-builds
          path: builds
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: bash tools/emulator-pool.sh
      - name: Package measured delivery report
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/delivery500-report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-5.0.0-delivery
          path: final-delivery/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-emulator-pool
          path: emulator-pool/
