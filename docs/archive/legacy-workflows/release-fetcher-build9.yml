name: Release INSFAV 5.0.0 build 9
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insfav-release-5.0.0-build9
  cancel-in-progress: false

env:
  INSFAV_RELEASE_CERT_SHA256: a3058fab8d03c1549abb04ae4660ff2256296967e6291bd7a751ecb9b32e82c2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Version and release-gate regressions
        run: |
          python3 -c "from pathlib import Path; assert Path('version.properties').read_text().splitlines() == ['VERSION_NAME=5.0.0','VERSION_CODE=9']"
          python3 -m unittest discover -s tools/release/tests -v
      - name: Android tests, lint and release compilation
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease --no-daemon --console=plain
      - name: Offline browser fixtures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/core.test.cjs
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          export CHROME_BIN="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          node tests/probe-classification.cjs | tee classification-results.txt
          node tests/probe-browser.cjs | tee probe-results.txt
      - name: Collect actual test and offline diagnostic evidence
        run: |
          python3 tools/release/build9_evidence.py --results app/build/test-results/testDebugUnitTest --output evidence --source "$GITHUB_SHA"
          cp docs/FETCHER-BUILD9.md evidence/Development-Report-TR.md
          git archive --format=zip --prefix=INSFAV/ -o evidence/INSFAV-Android-Studio-Project.zip "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: INSFAV-build9-verified-evidence
          path: evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-build9-test-reports
          path: |
            app/build/test-results/
            app/build/reports/lint-results-*
            classification-results.txt
            probe-results.txt

  signing-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check existing signing configuration without printing values
        env:
          INSFAV_KEYSTORE_BASE64: ${{ secrets.INSFAV_KEYSTORE_BASE64 }}
          INSFAV_STORE_PASSWORD: ${{ secrets.INSFAV_STORE_PASSWORD }}
          INSFAV_KEY_ALIAS: ${{ secrets.INSFAV_KEY_ALIAS }}
          INSFAV_KEY_PASSWORD: ${{ secrets.INSFAV_KEY_PASSWORD }}
        run: python3 tools/release/release_gate_500.py configuration

  signed-apk:
    if: github.repository == 'BlackWare-AI/INSFAV' && github.ref == 'refs/heads/main'
    needs: [verify, signing-configuration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: INSFAV-build9-verified-evidence
          path: evidence
      - name: Build with the original key and verify certificate and build
        env:
          INSFAV_KEYSTORE_BASE64: ${{ secrets.INSFAV_KEYSTORE_BASE64 }}
          INSFAV_STORE_PASSWORD: ${{ secrets.INSFAV_STORE_PASSWORD }}
          INSFAV_KEY_ALIAS: ${{ secrets.INSFAV_KEY_ALIAS }}
          INSFAV_KEY_PASSWORD: ${{ secrets.INSFAV_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir=$(mktemp -d "$RUNNER_TEMP/insfav-signing.XXXXXX")
          trap 'rm -rf "$private_dir"' EXIT
          export INSFAV_KEYSTORE="$private_dir/release.p12"
          python3 tools/release/release_gate_500.py prepare
          if ! ./gradlew :app:assembleRelease --no-daemon --console=plain > /dev/null 2>&1; then
            echo '::error::Release signing failed. Private signing output was suppressed.'
            exit 1
          fi
          python3 tools/release/release_gate_500.py verify --apk app/build/outputs/apk/release/app-release.apk --output candidate
          mkdir previous
          gh release download v5.0.0 --dir previous --pattern INSFAV-5.0.0.apk
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/release')
          import release_gate_500 as gate
          previous=Path('previous/INSFAV-5.0.0.apk')
          assert hashlib.sha256(previous.read_bytes()).hexdigest()=='62a999f7fe8488005c0dc0952cb31e67c4cb0924e809f07fb5c97cc249fa89a4'
          sdk=Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
          signer=sorted(sdk.glob('build-tools/*/apksigner'),key=lambda p:tuple(map(int,__import__('re').findall(r'\d+',p.parent.name))))[-1]
          assert gate.apk_certificate(signer,previous)==gate.fingerprint(os.environ['INSFAV_RELEASE_CERT_SHA256'])
          record=json.loads(Path('candidate/verification.json').read_text())
          tests=json.loads(Path('evidence/test-evidence.json').read_text())
          assert tests['sourceCommit']==os.environ['GITHUB_SHA'] and tests['build']==9
          assert tests['nativeTests']['tests']>0 and not any(tests['nativeTests'][k] for k in ['failures','errors','skipped'])
          record.update(previousApkCertificateComparison='Verified: published v5.0.0 build 8',testEvidence=tests)
          Path('candidate/verification.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          cp evidence/* candidate/
          cp docs/FETCHER-BUILD9.md candidate/RELEASE-NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: INSFAV-build9-signed-candidate
          path: candidate/

  publish:
    needs: signed-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: INSFAV-build9-signed-candidate
          path: candidate
      - name: Verify draft download and publish build 9
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check SHA256SUMS
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          old_digest=$(gh api "repos/$GH_REPO/releases/tags/v5.0.0" --jq '.assets[] | select(.name == "INSFAV-5.0.0.apk") | .digest')
          test "$old_digest" = 'sha256:62a999f7fe8488005c0dc0952cb31e67c4cb0924e809f07fb5c97cc249fa89a4'
          if gh release view v5.0.0-build.9 >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/v5.0.0-build.9" >/dev/null 2>&1; then
            echo '::error::Build 9 tag/release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create v5.0.0-build.9 INSFAV-5.0.0.apk SHA256SUMS signing-certificate.txt verification.json test-evidence.json INSFAV-Android-Studio-Project.zip Development-Report-TR.md diagnostics-offline-fixture.txt --draft --target "$GITHUB_SHA" --title 'INSFAV 5.0.0 — Build 9: Fetcher fast skip' --notes-file RELEASE-NOTES.md
          verify_dir=$(mktemp -d "$RUNNER_TEMP/insfav-build9.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download v5.0.0-build.9 --dir "$verify_dir" --pattern INSFAV-5.0.0.apk
          (cd "$verify_dir" && sha256sum --check "$GITHUB_WORKSPACE/candidate/SHA256SUMS")
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/releases/tags/v5.0.0" --jq '.assets[] | select(.name == "INSFAV-5.0.0.apk") | .digest')" = "$old_digest"
          gh release edit v5.0.0-build.9 --draft=false --latest
          gh release view v5.0.0-build.9 --json url --jq .url
