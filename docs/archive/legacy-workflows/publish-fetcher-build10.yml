name: Publish verified INSFAV build 10 update
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insfav-release-5.0.0-build10
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BlackWare-AI/INSFAV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify tested source, update signer and candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/release/tests -v
          test "$(gh api "repos/$GH_REPO/actions/runs/39726454095" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/39726454095" --jq .head_sha)" = 6fcaf3f61304b0e573c634cb80d6627c11cfdb97
          git diff --exit-code 6fcaf3f61304b0e573c634cb80d6627c11cfdb97 HEAD -- app web tests version.properties build.gradle settings.gradle gradle gradlew gradlew.bat package.json package-lock.json tools/minify.cjs tools/web-bundle.json
          git show 45bb5a7ac63dc6e75397de5b70eeb0f583d1d96e > public-candidate.zip
          echo 'e985c45df0f43f3e0de33b6d7b10d5ab29cc1133ca56b646680945aa50713f69  public-candidate.zip' | sha256sum --check
          unzip -q public-candidate.zip -d candidate
          (cd candidate && sha256sum --check SHA256SUMS)
          mkdir previous
          gh release download v5.0.0-build.9 --pattern INSFAV-5.0.0.apk --dir previous
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/release')
          import release_gate_500 as signing
          import update_build10 as gate
          gate.validate_record(json.loads(Path('candidate/verification.json').read_text()))
          apk=Path('candidate/INSFAV-5.0.0.apk');old=Path('previous/INSFAV-5.0.0.apk')
          gate.verify_hash(apk,gate.APK_SHA256);gate.verify_hash(old,gate.PREVIOUS_APK)
          sdk=Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
          tools=sorted(sdk.glob('build-tools/*/apksigner'))[-1].parent
          assert signing.apk_certificate(tools/'apksigner',apk)==gate.CERTIFICATE
          assert signing.apk_certificate(tools/'apksigner',old)==gate.CERTIFICATE
          gate.validate_manifest(signing.captured([str(tools/'aapt'),'dump','badging',str(apk)]))
          signing.captured([str(tools/'zipalign'),'-c','-P','16','4',str(apk)])
          PY
      - name: Upload and verify draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh api "repos/$GH_REPO/git/ref/tags/v5.0.0-build.10" > tag.json 2>/dev/null; then
            test "$(python3 -c 'import json; print(json.load(open("tag.json"))["object"]["sha"])')" = 6fcaf3f61304b0e573c634cb80d6627c11cfdb97
          fi
          release_id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "v5.0.0-build.10") | .id')
          if [ -z "$release_id" ]; then
            gh release create v5.0.0-build.10 --draft --target 6fcaf3f61304b0e573c634cb80d6627c11cfdb97 --title 'INSFAV 5.0.0 — Build 10' --notes-file candidate/RELEASE-NOTES.md
          fi
          release_id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "v5.0.0-build.10") | .id')
          test -n "$release_id"
          gh api "repos/$GH_REPO/releases/$release_id" > draft.json
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/release')
          import update_build10 as gate
          gate.validate_draft(json.load(open('draft.json')),{p.name for p in Path('candidate').iterdir()})
          PY
          gh release upload v5.0.0-build.10 candidate/* --clobber
          verify_dir=$(mktemp -d "$RUNNER_TEMP/insfav-build10-download.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download v5.0.0-build.10 --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum --check SHA256SUMS)
          test "$(gh api "repos/$GH_REPO/releases/tags/v5.0.0-build.9" --jq '.assets[] | select(.name == "INSFAV-5.0.0.apk") | .digest')" = 'sha256:3618347371a20f88954cec4e3992c3db8118cd3c068d7d6bf881b493489e4c2a'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit v5.0.0-build.10 --draft=false --latest
          gh release view v5.0.0-build.10 --json url --jq .url
