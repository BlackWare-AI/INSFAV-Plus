name: Publish verified settings safety update
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insfav-settings-safety-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BlackWare-AI/INSFAV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify provenance and publish a separate release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSFAV_RELEASE_CERT_SHA256: a3058fab8d03c1549abb04ae4660ff2256296967e6291bd7a751ecb9b32e82c2
        shell: bash
        run: |
          set -euo pipefail
          source_commit=52c91b87db26fee8d89640f339b28e583419147a
          test "$(gh api "repos/$GH_REPO/actions/runs/39637574032" --jq .head_sha)" = "$source_commit"
          test "$(gh api "repos/$GH_REPO/actions/runs/39637574032" --jq .conclusion)" = success
          git diff --exit-code "$source_commit" HEAD -- app web version.properties build.gradle settings.gradle gradle gradlew gradlew.bat
          old_digest=$(gh api "repos/$GH_REPO/releases/tags/v4.0.0" --jq '.assets[] | select(.name == "INSFAV-4.0.0.apk") | .digest')
          test "$old_digest" = sha256:061c568f3878e78a951a00d0ec5061b616ac2cd51d988b91a24244457bf824fa
          if gh release view v4.0.0-settings-safety >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/v4.0.0-settings-safety" >/dev/null 2>&1; then
            echo '::error::Update release or tag already exists; refusing to overwrite.'
            exit 1
          fi
          mkdir downloaded
          gh api "repos/$GH_REPO/git/blobs/ec10cbe635d486287ce778af3318768b45ba5708" --jq .content | base64 --decode > downloaded/INSFAV-4.0.0.apk
          echo '1948b71041013884aa627b8012c72a75c9394d7e5ddc9e20215f9f9e2da9bc84  downloaded/INSFAV-4.0.0.apk' | sha256sum --check
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/release')
          import release_gate
          release_gate.verify(Path('downloaded/INSFAV-4.0.0.apk'),Path('candidate'),dict(os.environ,GITHUB_SHA='52c91b87db26fee8d89640f339b28e583419147a'))
          record=json.loads(Path('candidate/verification.json').read_text())
          record.update(releaseCommit=os.environ['GITHUB_SHA'],testRun=39637574032,originalReleaseUnchanged=True)
          Path('candidate/verification.json').write_text(json.dumps(record,indent=2)+'\n')
          Path('candidate/RELEASE-NOTES.md').write_text('''# INSFAV 4.0.0 — Settings and thumbnail safety update

          Version **4.0.0 / build 7** is unchanged. This is a separately tagged APK using the same established BlackWare release certificate. The original v4.0.0 release and its APK are unchanged.

          - Preserve existing valid thumbnails, including 128×128 files, even when the Instagram account is unavailable.
          - Explicit Rescan prunes only direct orphan username WebP files in the managed .thumbnails folder, after validating a nonempty current Favorites list and obtaining SAF write permission. Initial folder indexing never prunes.
          - Empty, invalid, missing or unreadable Favorites never authorize deletion. Show preserved/deleted/error counts.
          - Remove legacy thumbnail refresh. Preserve local files during HD viewing; the HD source remains RAM-only.
          - Export All Settings / Import All Settings: portable password encryption covers preferences and cookies. Favorites, account queues, counters, indexes and image files are excluded. Retrieval remains stopped after import for review; SAF grants must be obtained on each device.
          - Enforce local 24-hour working windows, including overnight schedules, and replan on clock/timezone/reboot events.

          Automated Android, SAF, encrypted-backup, schedule, UI and emulator regression evidence is recorded in the linked workflow. Synthetic tests include 10,000 accounts and restoration with a different device encryption key. Real-device/OEM background behavior and live Instagram sessions have not been retested. Android can defer background work; Force Stop cannot be bypassed.

          Source: 52c91b87db26fee8d89640f339b28e583419147a
          Tests: https://github.com/BlackWare-AI/INSFAV/actions/runs/39637574032
          ''')
          PY
          git archive --format=zip --prefix=INSFAV/ -o candidate/INSFAV-Android-Studio-Project.zip "$source_commit"
          cd candidate
          sha256sum --check SHA256SUMS
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release create v4.0.0-settings-safety INSFAV-4.0.0.apk SHA256SUMS signing-certificate.txt verification.json INSFAV-Android-Studio-Project.zip --draft --target "$source_commit" --title 'INSFAV 4.0.0 — Thumbnail protection and settings backup' --notes-file RELEASE-NOTES.md
          verify_dir=$(mktemp -d "$RUNNER_TEMP/insfav-safety.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download v4.0.0-settings-safety --dir "$verify_dir" --pattern INSFAV-4.0.0.apk
          (cd "$verify_dir" && sha256sum --check "$GITHUB_WORKSPACE/candidate/SHA256SUMS")
          test "$(gh api "repos/$GH_REPO/releases/tags/v4.0.0" --jq '.assets[] | select(.name == "INSFAV-4.0.0.apk") | .digest')" = "$old_digest"
          gh release edit v4.0.0-settings-safety --draft=false --latest
          gh release view v4.0.0-settings-safety --json url --jq .url
