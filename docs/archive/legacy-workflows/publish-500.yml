name: Publish verified INSFAV 5.0.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-500.yml']
permissions:
  contents: read
concurrency:
  group: insfav-release-v5.0.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BlackWare-AI/INSFAV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify provenance, certificate continuity and draft assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSFAV_RELEASE_CERT_SHA256: a3058fab8d03c1549abb04ae4660ff2256296967e6291bd7a751ecb9b32e82c2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/release/tests
          source_commit=1b9d3ec8c63086024b44fd7faacbc864740df01f
          test "$(gh api "repos/$GH_REPO/actions/runs/39663421551" --jq .head_sha)" = "$source_commit"
          test "$(gh api "repos/$GH_REPO/actions/runs/39663421551" --jq .conclusion)" = success
          git diff --exit-code "$source_commit" HEAD -- app web version.properties build.gradle settings.gradle gradle gradlew gradlew.bat tools/delivery500-report.py tools/release
          old_digest=$(gh api "repos/$GH_REPO/releases/tags/v4.0.0" --jq '.assets[] | select(.name == "INSFAV-4.0.0.apk") | .digest')
          safety_digest=$(gh api "repos/$GH_REPO/releases/tags/v4.0.0-settings-safety" --jq '.assets[] | select(.name == "INSFAV-4.0.0.apk") | .digest')
          test "$old_digest" = sha256:061c568f3878e78a951a00d0ec5061b616ac2cd51d988b91a24244457bf824fa
          test "$safety_digest" = sha256:1948b71041013884aa627b8012c72a75c9394d7e5ddc9e20215f9f9e2da9bc84
          if gh release view v5.0.0 >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/v5.0.0" >/dev/null 2>&1; then
            echo '::error::Release or tag already exists; refusing to overwrite.'
            exit 1
          fi
          mkdir downloaded previous
          gh api "repos/$GH_REPO/git/blobs/665e3cbd7cc3961ab4ece9f411a0a4c042fc08eb" --jq .content | base64 --decode > downloaded/INSFAV-5.0.0.apk
          echo '62a999f7fe8488005c0dc0952cb31e67c4cb0924e809f07fb5c97cc249fa89a4  downloaded/INSFAV-5.0.0.apk' | sha256sum --check
          gh release download v4.0.0-settings-safety --dir previous --pattern INSFAV-4.0.0.apk
          echo '1948b71041013884aa627b8012c72a75c9394d7e5ddc9e20215f9f9e2da9bc84  previous/INSFAV-4.0.0.apk' | sha256sum --check
          gh run download 39663421551 --name INSFAV-5.0.0-delivery --dir evidence
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'tools/release')
          import release_gate_500 as gate
          env=dict(os.environ,GITHUB_SHA='1b9d3ec8c63086024b44fd7faacbc864740df01f')
          gate.verify(Path('downloaded/INSFAV-5.0.0.apk'),Path('candidate'),env)
          sdk=Path(env.get('ANDROID_HOME') or env['ANDROID_SDK_ROOT'])
          tools=sorted((p for p in (sdk/'build-tools').iterdir() if (p/'apksigner').is_file()),key=lambda p:tuple(map(int,__import__('re').findall(r'\d+',p.name))))[-1]
          previous=gate.apk_certificate(tools/'apksigner',Path('previous/INSFAV-4.0.0.apk'))
          assert previous==gate.fingerprint(env['INSFAV_RELEASE_CERT_SHA256'])
          record=json.loads(Path('candidate/verification.json').read_text())
          evidence=json.loads(Path('evidence/Verification.json').read_text())
          assert evidence['sourceCommit']=='1b9d3ec8c63086024b44fd7faacbc864740df01f' and evidence['version']=='5.0.0' and evidence['build']==8
          assert evidence['nativeTests']['failures']==evidence['nativeTests']['errors']==0
          record.update(releaseCommit=os.environ['GITHUB_SHA'],testRun=39663421551,
                        previousApkCertificateComparison='Verified: v4.0.0-settings-safety',
                        originalReleasesUnchanged=True,testEvidence=evidence)
          Path('candidate/verification.json').write_text(json.dumps(record,indent=2)+'\n')
          notes=Path('docs/RELEASE-5.0.0.md').read_text()
          notes+='\n## Verified publication\n\nAPK SHA-256: `62a999f7fe8488005c0dc0952cb31e67c4cb0924e809f07fb5c97cc249fa89a4`\n\nSource: `1b9d3ec8c63086024b44fd7faacbc864740df01f`\n\nTests: https://github.com/BlackWare-AI/INSFAV/actions/runs/39663421551\n\nThe APK signature and package/version/build were verified. The certificate matches the published v4.0.0-settings-safety APK; no new signing key was generated. Older releases are unchanged. Physical-device and live Instagram tests were not performed.\n'
          Path('candidate/RELEASE-NOTES.md').write_text(notes)
          PY
          cp evidence/INSFAV-Android-Studio-Project.zip candidate/
          cp evidence/Development-Report-TR.md candidate/
          cd candidate
          sha256sum --check SHA256SUMS
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release create v5.0.0 INSFAV-5.0.0.apk SHA256SUMS signing-certificate.txt verification.json INSFAV-Android-Studio-Project.zip Development-Report-TR.md --draft --target "$GITHUB_SHA" --title 'INSFAV 5.0.0 — Persistent Fetcher index and reliable resume' --notes-file RELEASE-NOTES.md
          verify_dir=$(mktemp -d "$RUNNER_TEMP/insfav500.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download v5.0.0 --dir "$verify_dir" --pattern INSFAV-5.0.0.apk
          (cd "$verify_dir" && sha256sum --check "$GITHUB_WORKSPACE/candidate/SHA256SUMS")
          test "$(gh api "repos/$GH_REPO/releases/tags/v4.0.0" --jq '.assets[] | select(.name == "INSFAV-4.0.0.apk") | .digest')" = "$old_digest"
          test "$(gh api "repos/$GH_REPO/releases/tags/v4.0.0-settings-safety" --jq '.assets[] | select(.name == "INSFAV-4.0.0.apk") | .digest')" = "$safety_digest"
          gh release edit v5.0.0 --draft=false --latest
          gh release view v5.0.0 --json url --jq .url
