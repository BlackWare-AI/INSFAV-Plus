plugins { id 'com.android.application'; id 'jacoco' }
def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }
android {
    namespace 'com.instagram.insfav'
    bundle { language { enableSplit = false } }
    compileSdk 35
    defaultConfig { applicationId 'com.instagram.insfav.plus'; minSdk 26; targetSdk 35; versionCode appVersion.VERSION_CODE.toInteger(); versionName appVersion.VERSION_NAME; testApplicationId 'com.instagram.insfav.plus.test'; testInstrumentationRunner 'com.instagram.insfav.fetcher.PoolInstrumentation' }
    testOptions { unitTests.includeAndroidResources = true }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('INSFAV_KEYSTORE')) {
                storeFile file(System.getenv('INSFAV_KEYSTORE'))
                storePassword System.getenv('INSFAV_STORE_PASSWORD')
                keyAlias System.getenv('INSFAV_KEY_ALIAS') ?: 'insfav'
                keyPassword System.getenv('INSFAV_KEY_PASSWORD') ?: System.getenv('INSFAV_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { versionNameSuffix '-debug'; enableUnitTestCoverage !project.hasProperty('benchmark') }
        release { if (System.getenv('INSFAV_KEYSTORE')) signingConfig signingConfigs.release; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}

jacoco { toolVersion = '0.8.13' }
android { testCoverage { jacocoVersion = '0.8.13' } }
tasks.register('jacocoDebugReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    reports { xml.required = true; html.required = true }
    sourceDirectories.setFrom(files('src/main/java'))
    classDirectories.setFrom(fileTree(layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')) { exclude '**/R.class', '**/R$*.class', '**/BuildConfig.*' })
    executionData.setFrom(files(layout.buildDirectory.file('outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec')))
}
// Coverage measures our code; instrumenting the Android/Robolectric frameworks adds no app coverage.
tasks.withType(Test).configureEach {
    jacoco { enabled = !project.hasProperty('benchmark'); includeNoLocationClasses = true; includes = ['com.instagram.insfav.*']; excludes = ['com.instagram.insfav.R', 'com.instagram.insfav.R$*', 'com.instagram.insfav.BuildConfig'] }
}

// Fail before packaging if generated WebView assets no longer match their web sources.
tasks.register('verifyWebAssets') {
    inputs.dir(rootProject.file('web'))
    inputs.file(rootProject.file('tools/web-bundle.json'))
    inputs.dir(file('src/main/assets'))
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(rootProject.file('tools/web-bundle.json'))
        manifest.each { name, entry ->
            def source = rootProject.file("web/${name}")
            if (!source.isFile()) source = rootProject.file("web/static/${name}")
            def asset = file("src/main/assets/${name}")
            def digest = { file -> java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
            if (!source.isFile() || !asset.isFile() || digest(source) != entry.sourceSha256 || digest(asset) != entry.bundleSha256)
                throw new GradleException("Web asset mismatch: ${name}. Run npm run web before building.")
            entry.includedSources?.each { included, metadata ->
                def part = rootProject.file("web/${included}")
                if (!part.isFile() || digest(part) != metadata.sourceSha256)
                    throw new GradleException("Web source mismatch: ${included}. Run npm run web before building.")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyWebAssets') }
