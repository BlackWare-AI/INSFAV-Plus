name: INSFAV Plus checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'BlackWare-AI/INSFAV-Plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run web:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:chromium
      - run: ./gradlew :app:testDebugUnitTest :app:jacocoDebugReport :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - run: python3 tools/verify-apk.py app/build/outputs/apk/debug/app-debug.apk --output artifacts/debug-apk.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-Plus-debug-test-and-coverage
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/
            app/build/test-results/
            artifacts/debug-apk.json
          retention-days: 30
  emulator:
    timeout-minutes: 30
    if: github.repository == 'BlackWare-AI/INSFAV-Plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Recover read-only original APK for coexistence
        run: |
          git clone --quiet --branch baseline/insfav-0a4ba91 docs/archive/source/insfav-baseline.bundle "$RUNNER_TEMP/insfav-baseline"
          git -C "$RUNNER_TEMP/insfav-baseline" show 0a4ba915418e0652618879d4af2c0745ef9ca4f0:release-assets/INSFAV-5.0.0.apk > "$RUNNER_TEMP/original-insfav.apk"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-port: 5554
          script: |
            python3 tools/coexist.py --serial emulator-5554 --original "$RUNNER_TEMP/original-insfav.apk" --plus app/build/outputs/apk/debug/app-debug.apk --output emulator-pool/coexist.json
            bash tools/emulator-pool.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-Plus-emulator-evidence
          path: emulator-pool/
