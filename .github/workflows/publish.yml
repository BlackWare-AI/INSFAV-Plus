name: INSFAV Plus publish
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Artifact kind (debug never creates a release)
        type: choice
        options: [debug, release]
        default: debug
      version:
        description: VERSION_NAME in the reviewed source
        default: '1.0.0'
        required: true
      code:
        description: VERSION_CODE (must exceed every earlier published APK)
        default: '1'
        required: true
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'BlackWare-AI/INSFAV-Plus' && startsWith(github.ref, 'refs/heads/')
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    if: github.repository == 'BlackWare-AI/INSFAV-Plus'
    runs-on: ubuntu-latest
    environment: plus-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Check reviewed version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_CODE: ${{ inputs.code }}
        run: |
          python3 - <<'PY'
          import os,re
          p=dict(line.split('=',1) for line in open('version.properties').read().splitlines() if '=' in line)
          assert re.fullmatch(r'\d+\.\d+\.\d+',os.environ['EXPECTED_VERSION'])
          assert p['VERSION_NAME']==os.environ['EXPECTED_VERSION']
          assert p['VERSION_CODE']==os.environ['EXPECTED_CODE']
          PY
      - name: Build test APK
        if: inputs.kind == 'debug'
        run: ./gradlew :app:assembleDebug
      - name: Prepare existing Plus signing material
        if: inputs.kind == 'release'
        env:
          PLUS_KEYSTORE_BASE64: ${{ secrets.PLUS_KEYSTORE_BASE64 }}
          PLUS_STORE_PASSWORD: ${{ secrets.PLUS_STORE_PASSWORD }}
          PLUS_KEY_PASSWORD: ${{ secrets.PLUS_KEY_PASSWORD }}
          PLUS_KEY_ALIAS: ${{ secrets.PLUS_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          for k in ['PLUS_KEYSTORE_BASE64','PLUS_STORE_PASSWORD','PLUS_KEY_PASSWORD','PLUS_KEY_ALIAS']:
              if not os.environ.get(k):raise SystemExit('Required Plus signing secret is missing')
          p=Path(os.environ['RUNNER_TEMP'])/'plus-release.jks'
          p.write_bytes(base64.b64decode(os.environ['PLUS_KEYSTORE_BASE64'],validate=True));p.chmod(0o600)
          PY
      - name: Build signed Plus APK
        if: inputs.kind == 'release'
        env:
          INSFAV_KEYSTORE: ${{ runner.temp }}/plus-release.jks
          INSFAV_STORE_PASSWORD: ${{ secrets.PLUS_STORE_PASSWORD }}
          INSFAV_KEY_PASSWORD: ${{ secrets.PLUS_KEY_PASSWORD }}
          INSFAV_KEY_ALIAS: ${{ secrets.PLUS_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease
      - name: Verify APK
        env:
          KIND: ${{ inputs.kind }}
          VERSION: ${{ inputs.version }}
          CODE: ${{ inputs.code }}
        run: |
          if [ "$KIND" = release ]; then
            python3 tools/verify-apk.py app/build/outputs/apk/release/app-release.apk --release --version "$VERSION" --code "$CODE" --output artifacts/apk.json
          else
            python3 tools/verify-apk.py app/build/outputs/apk/debug/app-debug.apk --version "$VERSION" --code "$CODE" --output artifacts/apk.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: INSFAV-Plus-${{ inputs.kind }}-${{ inputs.version }}-${{ inputs.code }}
          path: |
            app/build/outputs/apk/**/*.apk
            artifacts/apk.json
      - name: Publish verified release
        if: inputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CODE: ${{ inputs.code }}
        run: python3 tools/publish-plus.py
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/plus-release.jks"
