name: INSFAV Plus publish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml', 'version.properties']
  workflow_dispatch:
    inputs:
      kind:
        description: Artifact kind (debug never creates a release)
        type: choice
        options: [release, debug]
        default: release
      version:
        description: VERSION_NAME in the reviewed source
        default: '1.1.14'
        required: true
      code:
        description: VERSION_CODE (must exceed every earlier published APK)
        default: '17'
        required: true
      artifact_commit:
        description: Optional commit containing an owner-signed APK and public metadata
        required: false
        default: ''
      source_sha:
        description: Reviewed app source SHA for an owner-signed APK
        required: false
        default: ''
      validation_run:
        description: Successful current-source checks workflow run
        required: false
        default: ''
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'BlackWare-AI/INSFAV-Plus' && startsWith(github.ref, 'refs/heads/') && inputs.artifact_commit == ''
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    if: github.repository == 'BlackWare-AI/INSFAV-Plus' && inputs.artifact_commit == ''
    runs-on: ubuntu-latest
    environment: plus-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check reviewed version
        env:
          EXPECTED_VERSION: ${{ inputs.version || '1.1.14' }}
          EXPECTED_CODE: ${{ inputs.code || '17' }}
        run: |
          python3 - <<'PY'
          import os,re
          p=dict(line.split('=',1) for line in open('version.properties').read().splitlines() if '=' in line)
          assert re.fullmatch(r'\d+\.\d+\.\d+',os.environ['EXPECTED_VERSION'])
          assert p['VERSION_NAME']==os.environ['EXPECTED_VERSION']
          assert p['VERSION_CODE']==os.environ['EXPECTED_CODE']
          PY
      - name: Build test APK
        if: inputs.kind == 'debug'
        run: ./gradlew :app:assembleDebug
      - name: Prepare existing Plus signing material
        if: inputs.kind != 'debug'
        env:
          PLUS_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLUS_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PLUS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLUS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          bindings={'KEYSTORE_BASE64':'PLUS_KEYSTORE_BASE64','KEYSTORE_PASSWORD':'PLUS_STORE_PASSWORD','KEY_PASSWORD':'PLUS_KEY_PASSWORD','KEY_ALIAS':'PLUS_KEY_ALIAS'}
          missing=[name for name,variable in bindings.items() if not os.environ.get(variable)]
          if missing:raise SystemExit('Required repository signing secrets are unavailable: '+', '.join(missing))
          p=Path(os.environ['RUNNER_TEMP'])/'plus-release.jks'
          p.write_bytes(base64.b64decode(os.environ['PLUS_KEYSTORE_BASE64'],validate=True));p.chmod(0o600)
          PY
      - name: Build signed Plus APK
        if: inputs.kind != 'debug'
        env:
          INSFAV_KEYSTORE: ${{ runner.temp }}/plus-release.jks
          INSFAV_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INSFAV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          INSFAV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease
      - name: Verify APK
        env:
          KIND: ${{ inputs.kind || 'release' }}
          VERSION: ${{ inputs.version || '1.1.14' }}
          CODE: ${{ inputs.code || '17' }}
        run: |
          if [ "$KIND" = release ]; then
            python3 tools/verify-apk.py app/build/outputs/apk/release/app-release.apk --release --version "$VERSION" --code "$CODE" --output artifacts/apk.json
          else
            python3 tools/verify-apk.py app/build/outputs/apk/debug/app-debug.apk --version "$VERSION" --code "$CODE" --output artifacts/apk.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: INSFAV-Plus-${{ inputs.kind || 'release' }}-${{ inputs.version || '1.1.14' }}-${{ inputs.code || '17' }}
          path: |
            app/build/outputs/apk/**/*.apk
            artifacts/apk.json
      - name: Publish verified release
        if: inputs.kind != 'debug'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || '1.1.14' }}
          CODE: ${{ inputs.code || '17' }}
        run: python3 tools/publish-plus.py
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/plus-release.jks"
  publish-owner-signed:
    if: github.repository == 'BlackWare-AI/INSFAV-Plus' && inputs.kind != 'debug' && inputs.artifact_commit != ''
    runs-on: ubuntu-latest
    environment: plus-release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SOURCE: ${{ inputs.source_sha }}
      ARTIFACT_COMMIT: ${{ inputs.artifact_commit }}
      VALIDATION_RUN: ${{ inputs.validation_run }}
      EXPECTED_VERSION: ${{ inputs.version || '1.1.14' }}
      EXPECTED_CODE: ${{ inputs.code || '17' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and completed CI gates
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api',path],text=True))
          source=os.environ['REVIEWED_SOURCE'];run=os.environ['VALIDATION_RUN']
          assert re.fullmatch('[0-9a-f]{40}',source)
          assert re.fullmatch('[0-9a-f]{40}',os.environ['ARTIFACT_COMMIT'])
          assert run.isdecimal()
          subprocess.run(['git','diff','--exit-code',source,'--','app/src/main','web','version.properties'],check=True)
          record=api('repos/BlackWare-AI/INSFAV-Plus/actions/runs/'+run)
          assert record['head_sha']==source and record['conclusion']=='success'
          assert record['path']=='.github/workflows/ci.yml'
          jobs=api('repos/BlackWare-AI/INSFAV-Plus/actions/runs/'+run+'/jobs')['jobs']
          for required in ['verify','emulator']:
              assert any(job['name']==required and job['conclusion']=='success' for job in jobs)
          props=dict(line.split('=',1) for line in open('version.properties').read().splitlines() if '=' in line)
          assert props['VERSION_NAME']==os.environ['EXPECTED_VERSION']
          assert props['VERSION_CODE']==os.environ['EXPECTED_CODE']
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.artifact_commit }}
          path: .private/release-input
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify owner-signed APK and public metadata
        run: |
          mkdir -p app/build/outputs/apk/release
          cp .private/release-input/app-release.apk app/build/outputs/apk/release/app-release.apk
          python3 tools/verify-apk.py app/build/outputs/apk/release/app-release.apk --release --version "$EXPECTED_VERSION" --code "$EXPECTED_CODE" --output artifacts/apk.json
          python3 - <<'PY'
          import json,os
          current=json.load(open('artifacts/apk.json'))
          assert current==json.load(open('.private/release-input/apk.json'))
          assert current['certificateSha256']==['cffc756bf3d517b02780093e7d0d80ae737ce9e3b035a86a094f5698ffab35c8']
          assert json.load(open('.private/release-input/source.json'))['sourceCommit']==os.environ['REVIEWED_SOURCE']
          PY
      - name: Publish verified signed release
        env:
          PLUS_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 tools/publish-plus.py
