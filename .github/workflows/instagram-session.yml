name: Instagram session verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-durability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts && npm run web && npm test
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline browser persistence across process loss, update and reboot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/session-durability.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-Plus-instagram-session-evidence
          path: |
            session-evidence/
            app/build/test-results/
            app/build/reports/
